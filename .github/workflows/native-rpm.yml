name: Native RPM Builds

on:
  push:
    paths:
      - 'rpm/**'
      - 'trustiflux.spec'
      - 'Makefile'
      - 'Cargo.*'
      - 'attestation-agent/**'
      - 'confidential-data-hub/**'
      - 'api-server-rest/**'
      - 'protos/**'
      - '.github/workflows/native-rpm.yml'
  pull_request:
    paths:
      - 'rpm/**'
      - 'trustiflux.spec'
      - 'Makefile'
      - 'Cargo.*'
      - 'attestation-agent/**'
      - 'confidential-data-hub/**'
      - 'api-server-rest/**'
      - 'protos/**'
      - '.github/workflows/native-rpm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro: [al8, an23]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke-test native RPMs
        run: sudo bash rpm/build-rpm.sh "${{ matrix.distro }}"
      - uses: actions/upload-artifact@v6
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            rpm-output/${{ matrix.distro }}/${{ matrix.arch }}/RPMS/**/*.rpm
            rpm-output/${{ matrix.distro }}/${{ matrix.arch }}/SRPMS/*.rpm
